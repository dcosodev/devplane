[project]
name = "devplane"
version = "0.2.2"
description = "Local-first organizational capability catalog and multi-agent development control plane"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Daniel CS" }]
keywords = [
  "ai-agents",
  "capability-catalog",
  "developer-tools",
  "multi-agent",
  "spec-driven-development",
  "spec-kit",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "typer>=0.27.1",
  "pyyaml>=6.0",
  "packaging>=26.3",
]

[project.urls]
Homepage = "https://github.com/dcosodev/devplane"
Documentation = "https://github.com/dcosodev/devplane#readme"
Issues = "https://github.com/dcosodev/devplane/issues"
Repository = "https://github.com/dcosodev/devplane"

[project.optional-dependencies]
test = [
  "bandit>=1.9,<2",
  "pip-audit>=2.10,<3",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.16,<0.17",
  "twine>=7,<8",
]

[project.scripts]
devplane = "devplane.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devplane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
