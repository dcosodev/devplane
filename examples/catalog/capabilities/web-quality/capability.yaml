apiVersion: devplane.dev/v1
kind: Capability
metadata:
  id: web-quality
  version: 1.0.0
spec:
  context:
    plan:
      include:
        - instructions.md
    implement:
      include:
        - instructions.md
  permissions:
    write:
      - "src/**"
      - "app/**"
      - "components/**"
      - "tests/**"
      - "package.json"
    shell:
      allow:
        - "npm test*"
        - "npm run lint*"
  validations:
    - "npm test"
    - "npm run lint"
