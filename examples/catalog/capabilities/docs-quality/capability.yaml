apiVersion: devplane.dev/v1
kind: Capability
metadata:
  id: docs-quality
  version: 1.0.0
spec:
  context:
    plan:
      include:
        - instructions.md
    implement:
      include:
        - instructions.md
  permissions:
    write:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
    shell:
      allow:
        - "git diff --check"
  validations:
    - "git diff --check"
