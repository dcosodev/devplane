apiVersion: devplane.dev/v1
kind: Capability
metadata:
  id: python-quality
  version: 1.0.0
spec:
  context:
    plan:
      include:
        - instructions.md
    implement:
      include:
        - instructions.md
  permissions:
    write:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
    shell:
      allow:
        - "uv run pytest*"
        - "uv run ruff*"
  validations:
    - "uv run pytest"
    - "uv run ruff check src tests"
